name: CI/CD

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

jobs:
  ci:
    name: CI - build e verificações
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar o schema do Prisma
        run: npx prisma validate

      - name: Verificar erros de TypeScript
        run: npm run typecheck

      - name: Rodar os testes
        run: npm test

  deploy:
    name: CD - deploy no Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    steps:
      - name: Disparar o deploy no Render

        run: curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}