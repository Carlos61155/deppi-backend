services:
  db:
    image: postgres:15
    container_name: deppi-extension-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deppi_extension_user
      POSTGRES_PASSWORD: deppi_extension_password
      POSTGRES_DB: deppi_extension_db
    ports:
      - "5432:5432"
    volumes:
      - deppi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deppi_extension_user -d deppi_extension_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deppi_postgres_data:
